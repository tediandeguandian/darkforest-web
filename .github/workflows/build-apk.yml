name: build-apk

# 手工构建 APK（不依赖 Gradle）：aapt2 → javac → d8 → zipalign → apksigner
# 之所以能塞进 CI：apk/build.sh 只要 SDK 的 build-tools + android-34，
# 而 GitHub 的 ubuntu runner 自带 Android SDK，装两个组件就能跑。
on:
  workflow_call:
  workflow_dispatch:

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 准备 Android SDK 组件
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          [ -n "$SDK" ] || { echo "✗ runner 上没有 Android SDK" >&2; exit 1; }
          echo "SDK=$SDK"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || { echo "✗ 找不到 sdkmanager（$SM）" >&2; exit 1; }
          # build-tools 34 自带的 d8（R8 8.2）在本工程的 lambda 字节码上会 NPE，
          # 必须 35+。apk/build.sh 会自动挑版本最高的那套，这里只是保证它存在。
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platforms;android-34" "build-tools;35.0.0" >/dev/null
          ls "$SDK/build-tools"

      # 版本号有两个真源容易走散：desktop/package.json（全网发版用）和
      # AndroidManifest（安装包自己的 versionName / versionCode）。
      # versionCode 必须手工递增（覆盖安装靠它），没法自动算，所以只做校验。
      - name: 校验安卓版本号与各端一致
        run: |
          set -e
          VER=$(node -p "require('./desktop/package.json').version")
          NAME=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' apk/AndroidManifest.xml)
          CODE=$(sed -n 's/.*android:versionCode="\([^"]*\)".*/\1/p' apk/AndroidManifest.xml)
          echo "· desktop/package.json = $VER，AndroidManifest = $NAME（code $CODE）"
          if [ "$VER" != "$NAME" ]; then
            echo "✗ 版本号不一致：把 apk/AndroidManifest.xml 的 versionName 改成 $VER，" >&2
            echo "  并把 versionCode 加 1（当前 $CODE）。" >&2
            exit 1
          fi

      - name: 构建 APK
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          sh apk/build.sh
          VER=$(node -p "require('./desktop/package.json').version")
          ls -lh "黑暗森林-v$VER.apk" web/download/apk.json web/download/dark-forest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dark-forest-apk
          # apk.json 一起带上：publish 阶段要把它和 dmg / exe 一起放进 web/download
          path: |
            web/download/dark-forest.apk
            web/download/apk.json
          if-no-files-found: error

      - name: 挂到 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # 别用 continue-on-error 吞掉失败：Release 不存在时附件会静默丢失，
          # 页面上什么都看不出来。release.yml 的 prepare 已保证它存在。
          gh release view "${GITHUB_REF_NAME}" >/dev/null
          VER=$(node -p "require('./desktop/package.json').version")
          # 附件名一律 ASCII：中文名进下载 URL 会被百分号编码，
          # 和 README / 清单里写的 dark-forest-<版本>.apk 对不上
          cp "黑暗森林-v$VER.apk" "dark-forest-$VER.apk"
          gh release upload "${GITHUB_REF_NAME}" "dark-forest-$VER.apk" --clobber
          echo "· 已上传 dark-forest-$VER.apk"
