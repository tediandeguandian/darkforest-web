name: build-macos

# macOS DMG 构建（Tauri 轻量版，通用二进制 x86_64 + arm64，最低 macOS 10.15）
#   · 打 tag：由 release.yml 调度（workflow_call），构完自动挂到该 Release
#   · 手动触发：Actions → build-macos → Run workflow（只出 artifact，不挂 Release）
#
# ⚠️ 别再给它加 push.tags：release.yml 已经会调它，两条路都开着就会同一个 tag
#    构建两遍、并发上传同一个附件，白烧 macOS runner 的 10 倍计费额度。
on:
  workflow_dispatch:
  workflow_call:

jobs:
  dmg:
    name: macOS DMG（universal，10.15+）
    # 必须是 macOS runner：dmg 依赖 hdiutil / codesign，Linux 上做不出来
    # macos-14 已被 GitHub 退役：job 会在 1 秒内被取消，
    # 注解写 "The configuration 'macos-14-arm64-us-default' is not supported"。
    # 用 macos-15 显式指定，别用 macos-latest（升级到 macOS 26 时 SDK 又会跳一版）。
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 同步版本号（唯一真源 desktop/package.json）
        run: sh tools/sync-version.sh

      - name: 整理前端（web/ + shared/ → desktop-tauri/www）
        run: sh desktop-tauri/prep.sh

      - name: 生成 icon.icns（macOS 打包必需）
        run: |
          set -e
          # 必须用 macos-1024.png：它是「1024 画布 + 824 圆角方块居中」的 Big Sur 网格版，
          # Dock 里才和系统设置一样大。source-ai-1024.png 是铺满画布的母版（安卓/Windows 用），
          # 拿它做 icns 会整整大一圈。两者都由 tools/mac-icon.py 维护。
          SRC=apk/icon/macos-1024.png
          [ -f "$SRC" ] || SRC=apk/icon/source-ai-1024.png
          [ -f "$SRC" ] || SRC=desktop-tauri/src-tauri/icons/icon.png
          rm -rf /tmp/icon.iconset && mkdir -p /tmp/icon.iconset
          for s in 16 32 64 128 256 512; do
            sips -z $s $s "$SRC" --out /tmp/icon.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s * 2))
            sips -z $d $d "$SRC" --out /tmp/icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns /tmp/icon.iconset -o desktop-tauri/src-tauri/icons/icon.icns
          ls -lh desktop-tauri/src-tauri/icons/icon.icns

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: cargo 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri

      - name: 安装 tauri-cli（走 npm 预编译包，比 cargo install 快很多）
        run: npm install -g @tauri-apps/cli@^2

      - name: 构建 DMG（universal）
        working-directory: desktop-tauri
        run: tauri build --target universal-apple-darwin --bundles dmg

      - name: 产物改名（中文名 + 空格过 CI 容易出问题）
        shell: bash
        run: |
          set -e
          VER=$(node -p "require('./desktop/package.json').version")
          cd desktop-tauri/src-tauri/target/universal-apple-darwin/release/bundle/dmg
          for f in *.dmg; do mv "$f" "dark-forest-${VER}-macos-universal.dmg"; done
          ls -lh

      - name: 校验 DMG 内的 app 与最低系统版本
        run: |
          set -e
          DMG=$(ls desktop-tauri/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint /tmp/dfmnt
          APP=$(ls -d /tmp/dfmnt/*.app | head -1)
          echo "APP = $APP"
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$APP/Contents/Info.plist"
          lipo -archs "$APP/Contents/MacOS/"*
          codesign -dv "$APP" 2>&1 | head -5 || true
          hdiutil detach /tmp/dfmnt

      - uses: actions/upload-artifact@v4
        with:
          name: dark-forest-macos-dmg
          path: desktop-tauri/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      # 以前这一步带 continue-on-error: true：Release 不存在时 gh 会失败，
      # 但失败被吞掉，job 显示绿色，附件其实没传上去——「发了个没有安装包的版」。
      # 现在先确认 Release 存在（release.yml 的 prepare 会建好），再传，出错就红。
      - name: 挂到 Release（只传附件，不改正文）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release view "${GITHUB_REF_NAME}" >/dev/null
          gh release upload "${GITHUB_REF_NAME}" \
            desktop-tauri/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg --clobber
          echo "· 已上传 $(ls desktop-tauri/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)"
