name: build-windows

# 手动触发，或者打 tag（v1.0.14）时自动构建
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  # ------------------------------------------------------------
  # Tauri 安装包：约 5 MB，安装时自动检测 / 下载 WebView2
  # ------------------------------------------------------------
  tauri:
    name: Tauri 安装包（小）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 整理前端（web/ + shared/ → desktop-tauri/www）
        shell: bash
        run: sh desktop-tauri/prep.sh

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri

      - name: 安装 tauri-cli
        shell: bash
        run: cargo install tauri-cli --version "^2" --locked

      - name: 构建 NSIS 安装包
        shell: bash
        working-directory: desktop-tauri
        run: cargo tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: dark-forest-tauri-setup
          path: desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # 打 tag 触发的构建：把安装包直接挂到那个版本的 Release 上（不用再去 Actions 页面下载）
      - name: 挂到 Release
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe
          body: |
            ### Tauri 轻量版（推荐）
            约 1.5 MB，使用系统自带的 WebView2；安装程序会自动检测，缺了会联网下载。
            想省磁盘、或不想装 WebView2 的，用下面的 Electron 完整版（零依赖，约 100 MB）。

  # ------------------------------------------------------------
  # Electron 安装包：约 90 MB，不依赖 WebView2
  # ------------------------------------------------------------
  electron:
    name: Electron 安装包（大，零依赖）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 整理前端（web/ + shared/ → desktop/www）
        shell: bash
        run: sh tools/prep-frontend.sh desktop/www

      - name: 准备图标
        shell: bash
        run: |
          mkdir -p desktop/build
          # 仓库里已经带了 desktop/assets/icon.ico（提交进版本库，不用现场生成）；
          # 万一没有才退回去用 Pillow 现做一个——runner 上默认没装 Pillow。
          if [ -f desktop/assets/icon.ico ]; then
            cp desktop/assets/icon.ico desktop/build/icon.ico
            echo "用仓库里的 assets/icon.ico"
          else
            python -m pip install --quiet pillow
            python -c "from PIL import Image; Image.open('apk/icon/icon-512.png').convert('RGBA').save('desktop/build/icon.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          fi

      - name: 安装依赖
        shell: bash
        working-directory: desktop
        run: npm ci


      - name: 构建 NSIS 安装包
        shell: bash
        working-directory: desktop
        run: npx electron-builder --win nsis --x64

      - uses: actions/upload-artifact@v4
        with:
          name: dark-forest-electron-setup
          path: desktop/release/*.exe
          if-no-files-found: error

      - name: 挂到 Release
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/*.exe
