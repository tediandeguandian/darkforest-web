appId: com.shuwang.darkforest
productName: 黑暗森林
copyright: shuwang
directories:
  output: release
  buildResources: build

# 只打这几样：main.js + 页面 + package.json
files:
  - main.js
  - package.json
  - www/**/*

# ⚠️ 不用 asar：本机文件沙箱会在 asar 打包时失败（详见 README）
asar: false


# 最高压缩（NSIS 用 LZMA 固实压缩，比 zip 小很多）
compression: maximum

win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.ico
  artifactName: 黑暗森林-${version}-win64-setup.${ext}

nsis:
  oneClick: false                     # 有向导：可以选安装目录
  perMachine: false                   # 默认装到当前用户，不需要管理员权限
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 黑暗森林
  installerLanguages: [zh_CN]
  deleteAppDataOnUninstall: false      # 卸载不删存档与设置
  runAfterFinish: true
