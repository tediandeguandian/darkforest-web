<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三体 · 黑暗森林（联机版）</title>
<link rel="stylesheet" href="/web/style.css">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<div id="app"></div>
<script>
/* 同 local.html：壳内页面互跳时，首帧先贴上上一页的画面，避免整页导航白一帧
   + 重播入场动画造成的「闪一下」。ui.js 读到 DF_HANDOFF 会跳过本次入场。 */
(function () {
  var fresh = location.hash === '#df';
  var raw = null, app = document.getElementById('app');
  try { raw = sessionStorage.getItem('df_handoff'); } catch (e) {}
  if (!raw && !fresh) return;
  try { sessionStorage.removeItem('df_handoff'); } catch (e) {}
  window.DF_HANDOFF = 1;
  var d = null;
  try { d = JSON.parse(raw || 'null'); } catch (e) {}
  if (app && d && d.html && Date.now() - d.at < 3000) {
    app.innerHTML = d.html;
    app.style.pointerEvents = 'none';
  }
})();
</script>
<div class="conn" id="conn">连接已断开，正在重连…</div>
<script src="/shared/cards.js"></script>
<script src="/web/js/net.js"></script>
<script src="/web/js/ui.js"></script>
</body>
</html>
