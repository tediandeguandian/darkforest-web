name = "dark-forest"
main = "src/index.js"

# workers.dev 也留着当兜底地址（自定义域名挂了还能进）
workers_dev = true
compatibility_date = "2025-06-01"

# 自定义域名：两个都挂着。
# ⚠️ 教训：shuwang 这条 custom domain 一旦从 routes 里删掉，Cloudflare 会**连带把它的
#    DNS 记录一起删掉**，域名直接不解析（502 / No answer）——哪怕你在控制台配了重定向
#    规则也没用，因为规则要建立在记录存在的前提下。所以旧域名必须一直挂在这里。
routes = [
  { pattern = "darkforest.dpdns.org", custom_domain = true },
  { pattern = "shuwang.dpdns.org", custom_domain = true },
]

# 静态资源：构建时把 web/ 与 shared/ 组装到 public/
[assets]
directory = "./public"
binding = "ASSETS"

[build]
command = "sh build.sh"

# 每个房间一个 Durable Object
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# 账号表：一个单实例 DO（idFromName("global")）。
# 为什么不按用户名分片：注册要判重名，分片后就得跨实例查，反而要加全局索引。
[[durable_objects.bindings]]
name = "USERS"
class_name = "Users"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# v1 不能删——Room 的数据依赖它。v2 只新增 Users，不改 Room。
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Users"]

# ── 可选：KV 只做索引/战绩，不存对局状态 ──
# 创建：npx wrangler kv namespace create META
# [[kv_namespaces]]
# binding = "META"
# id = "粘贴你的 namespace id"

# ── 账号体系的发信配置（全部走 secret，别写在这里，仓库是公开的）──
#   wrangler secret put SMTP_USER     发信邮箱，例如 shuwang@email.cn
#   wrangler secret put SMTP_PASS     邮箱的「专用密码」，不是登录密码
#   wrangler secret put SMTP_HOST     可选，默认 smtp.email.cn
#   wrangler secret put SMTP_PORT     可选，默认 465（25 被平台封了，别用）
#   wrangler secret put MAIL_FROM     可选，默认同 SMTP_USER
#   wrangler secret put MAIL_MODE     =console 时不真发信，只把验证码打进日志
#
# 没配 SMTP_USER / SMTP_PASS 时，注册与登录照常可用（邮箱本来就是可选项），
# 但「绑定邮箱」会返回「这台服务器还没配置发信邮箱」。这是部署问题，不是代码问题。

# 人机"思考"时长（毫秒）：玩家能看到人机在犹豫，而不是秒出牌
[vars]
AI_THINK_MIN = "3000"
AI_THINK_MAX = "10000"
